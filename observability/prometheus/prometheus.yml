# Layer 3 - Prometheus scrapes every service every 5 seconds.
# Job names are the service names: the intelligence layer reads `up{job="<service>"}`.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8082"]

  - job_name: payment-standby
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-standby:8082"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8083"]

  - job_name: remediation-engine
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["remediation-engine:8090"]

  - job_name: intelligence-service
    metrics_path: /metrics
    static_configs:
      - targets: ["intelligence-service:8000"]
