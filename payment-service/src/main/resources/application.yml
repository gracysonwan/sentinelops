server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelops}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

sentinel:
  # "primary" or "standby" - the same image runs as both instances
  instance-name: ${INSTANCE_NAME:primary}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # the standby container overrides this with METRICS_APP_TAG=payment-standby
      application: ${METRICS_APP_TAG:${spring.application.name}}
    distribution:
      percentiles-histogram:
        http.server.requests: true
