server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelops}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

sentinel:
  inventory-url: ${INVENTORY_URL:http://localhost:8083}
  payment-primary-url: ${PAYMENT_PRIMARY_URL:http://localhost:8082}
  payment-standby-url: ${PAYMENT_STANDBY_URL:http://localhost:8084}
  client:
    read-timeout-ms: 3000

# Layer 3 - observability: expose health + Prometheus metrics, with latency histograms for p95
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Containment layer - Resilience4j circuit breakers on both downstream calls
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      payment:
        base-config: default
      inventory:
        base-config: default

logging:
  level:
    com.sentinelops: INFO
